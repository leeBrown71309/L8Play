[package]
name = "l8-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
hex = "0.4.3"
keyring = "4.2.0"
keyvalues-parser = "0.2.4"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
steamlocate = "2.1.1"
sysinfo = "0.40.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tracing = "0.1.44"
ts-rs = "12.0.1"
ureq = "3.5.1"
uuid = { version = "1.29.0", features = ["v7"] }
walkdir = "2.5.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = "0.3.23"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
