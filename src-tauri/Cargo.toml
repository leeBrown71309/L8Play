[package]
name = "l8-play"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
l8-core = { version = "0.1.2", path = "../crates/l8-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
